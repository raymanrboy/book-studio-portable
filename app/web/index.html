<!doctype html>
<html lang="uk" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="studio-token" content="__STUDIO_TOKEN__">
  <meta name="media-token" content="__MEDIA_TOKEN__">
  <meta name="color-scheme" content="dark light">
  <title>Book Studio</title>
  <link rel="icon" href="/img/icon.png" type="image/png">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/library.css">
  <link rel="stylesheet" href="/css/orders.css">
  <link rel="stylesheet" href="/css/profit.css">
  <link rel="stylesheet" href="/css/listings.css">
  <link rel="stylesheet" href="/css/motion-mockups.css">
  <link rel="stylesheet" href="/css/motion-settings.css">
  <script>
    // Apply the saved theme before first paint (no flash).
    try {
      var t = localStorage.getItem('bs-theme') || 'dark';
      if (t === 'system') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.dataset.theme = t;
      if (localStorage.getItem('bs-motion') === 'reduce') document.documentElement.dataset.motion = 'reduce';
    } catch (e) {}
  </script>
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main" id="main">
      <div class="view" id="view"></div>
    </main>
  </div>
  <div class="topbar" id="topbar"></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div class="offline" id="offline" hidden>
    <div class="offline-card">
      <div class="offline-icon">!</div>
      <h2>Зв'язок із програмою втрачено</h2>
      <p>Book Studio закрито або перезапущено. Запустіть програму з ярлика на робочому столі.</p>
      <button class="btn btn-primary" onclick="location.reload()">Спробувати знову</button>
    </div>
  </div>
  <!-- The modules the first page needs, asked for at once instead of one after another as each import is found. -->
  <link rel="modulepreload" href="/js/lib.js">
  <link rel="modulepreload" href="/js/icons.js">
  <link rel="modulepreload" href="/js/info.js">
  <link rel="modulepreload" href="/js/keep.js">
  <link rel="modulepreload" href="/js/handoff.js">
  <link rel="modulepreload" href="/js/order-bits.js">
  <link rel="modulepreload" href="/js/lightbox.js">
  <link rel="modulepreload" href="/js/pages/orders.js">
  <link rel="modulepreload" href="/js/drop-anywhere.js">
  <link rel="modulepreload" href="/js/drop.js">
  <link rel="modulepreload" href="/js/pages/order-card.js">
  <link rel="modulepreload" href="/js/folder-viewer.js">
  <link rel="modulepreload" href="/js/modules-ui.js">
  <link rel="modulepreload" href="/js/path.js">
  <link rel="modulepreload" href="/js/pages/gelato-result.js">
  <script type="module" src="/js/app.js"></script>
</body>
</html>
